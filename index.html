 for(let i=0;i<L.length;){let j=i;while(j<L.length&&L[j].pts===L[i].pts)j++;const cl=L.slice(i,j);
  if(cl.length===2){const h=g.ties.find(t=>t.w!=null&&cl.some(x=>x.c===t.a)&&cl.some(x=>x.c===t.b));if(h&&h.w===cl[1].c)cl.reverse()}
  else if(cl.length>2)cl.sort((x,y)=>(y.rw-y.rl)-(x.rw-x.rl)||(y.sw-y.sl)-(x.sw-x.sl)||(y.gw-y.gl)-(x.gw-x.gl)||(fin?Math.random()-.5:0));
  out.push(...cl);i=j}return out}

 if(ev.stage===2){ev.groups.forEach(g=>{g.order=gOrder(g,true).map(x=>x.c)});const G=ev.groups.map(g=>g.order);ev.qfs=[mkTie(ev,G[0][0],G[1][1],3),mkTie(ev,G[1][0],G[0][1],3),mkTie(ev,G[2][0],G[3][1],3),mkTie(ev,G[3][0],G[2][1],3)]}
 else if(ev.stage===3)ev.sfs=[mkTie(ev,ev.qfs[0].w,ev.qfs[1].w,4),mkTie(ev,ev.qfs[2].w,ev.qfs[3].w,4)];

function simDCStage(i){startDC(i);const ev=S.ev[i];stageTies(ev).forEach(t=>simTie(i,t));advDC(i)}
function simDC(i){startDC(i);while(S.ev[i].st!==2)simDCStage(i)}
function finishDC(i){const ev=S.ev[i],f=ev.fin;ev.champ=f.w;ev.runner=f.w===f.a?f.b:f.a;ev.fs=f.sc;const sfT=new Set(ev.sfs.flatMap(t=>[t.a,t.b])),qfT=new Set(ev.qfs.flatMap(t=>[t.a,t.b])),pz={},nat={};
 DCN.forEach(c=>ev.ros[c].forEach(id=>{nat[id]=c;pz[id]=c===ev.champ?750:c===ev.runner?400:sfT.has(c)?200:qfT.has(c)?125:75}));
 allTies(ev).forEach(t=>t.r.forEach(r=>{if(r.dbl)(r.w===r.a?r.pa:r.pb).forEach(id=>{pz[id]+=25});else pz[r.w]+=25}));
 Object.keys(pz).forEach(k=>{const p=P(+k);p.cp+=pz[k];p.res.push({s:S.season,i,p:0,$:pz[k],r:nat[k]===ev.champ?'W':'DC'})});
 S.dc.push({s:S.season,host:ev.host,sf:ev.sf,ros:ev.ros,seedN:ev.seedN,groups:ev.groups,qfs:ev.qfs,sfs:ev.sfs,fin:ev.fin,v2:1,champ:ev.champ,runner:ev.runner,fs:ev.fs,prize:pz,mv:mvpCalc(ev,'dc')});ev.st=2;bump(i);save()}
const curEd=ev=>({s:S.season,host:ev.host,sf:ev.sf,ros:ev.ros,seedN:ev.seedN,groups:ev.groups,qfs:ev.qfs,sfs:ev.sfs,fin:ev.fin,v2:ev.v2,live:1});

function dcP(id){const o={ed:0,ties:0,rw:0,rl:0,sw:0,sl:0,gw:0,gl:0,dw:0,dl:0,dsw:0,dsl:0,ti:0,fin:0,$:0};
 eds().forEach(ed=>{const nat=Object.keys(ed.ros).find(k=>ed.ros[k].includes(id));if(!nat)return;o.ed++;if(ed.champ===nat)o.ti++;if(ed.champ===nat||ed.runner===nat)o.fin++;if(ed.prize&&ed.prize[id])o.$+=ed.prize[id];
  allTies(ed).forEach(t=>{let pl=0;t.r.forEach(r=>{if(r.dbl){const sd=(r.pa||[]).includes(id)?0:(r.pb||[]).includes(id)?1:-1;if(sd<0)return;pl=1;(r.w===r.a)===(sd===0)?o.dw++:o.dl++;o.dsw+=r.ss[sd];o.dsl+=r.ss[1-sd];return}const sd=r.a===id?0:r.b===id?1:-1;if(sd<0)return;pl=1;r.w===id?o.rw++:o.rl++;o.sw+=r.ss[sd];o.sl+=r.ss[1-sd];o.gw+=r.gg[sd];o.gl+=r.gg[1-sd]});o.ties+=pl})});return o}
function dcN(c){const o={ed:0,ti:0,fin:0,sf:0,qf:0,tw:0,tl:0,rw:0,rl:0,sw:0,sl:0,dw:0,dl:0,dsw:0,dsl:0};
 eds().forEach(ed=>{if(!ed.groups.some(g=>g.t.includes(c)))return;o.ed++;if(ed.champ===c)o.ti++;if(ed.champ===c||ed.runner===c)o.fin++;if((ed.sfs||[]).some(t=>t.a===c||t.b===c))o.sf++;if((ed.qfs||[]).some(t=>t.a===c||t.b===c))o.qf++;
  allTies(ed).forEach(t=>{if(t.a!==c&&t.b!==c)return;const sd=t.a===c?0:1;if(t.w!=null)t.w===c?o.tw++:o.tl++;t.r.forEach(r=>{const win=(r.w===r.a)===(sd===0);if(r.dbl){win?o.dw++:o.dl++;o.dsw+=r.ss[sd];o.dsl+=r.ss[1-sd]}else{win?o.rw++:o.rl++;o.sw+=r.ss[sd];o.sl+=r.ss[1-sd]}})})});return o}

const LCT=['Team Europe','Team World'],LCF=['🇪🇺','🌍'],lcT=k=>LCF[k]+' '+LCT[k];

function startLC(i){const ev=S.ev[i];if(ev.lc)return;const u=lcSetup();ev.ven=lcVenue(S.season);ev.pos=u.pos;
 ev.lc={eu:u.eu,wd:u.wd,er:u.eu.map(id=>u.pos[id]),wr:u.wd.map(id=>u.pos[id]),rubs:[],pt:[0,0],w:null};ev.st=1}

function lcNext(L){const n=L.rubs.length;
 if(n<3)return{a:L.eu[2*n],b:L.wd[2*n],pa:L.eu.slice(2*n,2*n+2),pb:L.wd.slice(2*n,2*n+2),dbl:1,w:null,s:'',day:1,bo:3,k:n};
 const k=n-3;return{a:L.eu[k],b:L.wd[k],w:null,s:'',day:2,bo:5,k:n}}
function lcAdd(i,r){const L=S.ev[i].lc;L.rubs.push(r);L.pt[r.w===r.a?0:1]++;if(L.pt[0]>=5||L.pt[1]>=5){L.w=L.pt[0]>=5?0:1;finishLC(i)}}
function lcStep(i){startLC(i);const L=S.ev[i].lc;if(L.w!=null)return;const r=lcNext(L);simMt(r,i,{bo:r.bo});lcAdd(i,r)}
function simLCDay(i){startLC(i);const L=S.ev[i].lc;if(L.w!=null)return;const d=lcNext(L).day;while(L.w==null&&lcNext(L).day===d)lcStep(i)}

function finishLC(i){const ev=S.ev[i],L=ev.lc;ev.fs=L.pt[L.w]+'-'+L.pt[1-L.w];ev.champ=L.w;
 S.lc.push({s:S.season,ven:ev.ven,eu:L.eu,wd:L.wd,er:L.er,wr:L.wr,rubs:L.rubs,pt:L.pt,w:L.w,fs:ev.fs,mv:mvpCalc({eu:L.eu,wd:L.wd,rubs:L.rubs,w:L.w},'lc')});ev.st=2;bump(i);save()}

function mvpCalc(ed,type){const T={},g=(id,t)=>T[id]=T[id]||{id,t,sw:0,sl:0,dw:0,dl:0,st:0,gd:0},

 rubs.forEach(r=>{const w0=r.w===r.a;(r.dbl?[r.pa,r.pb]:[[r.a],[r.b]]).forEach((ids,sd)=>ids.forEach(id=>{
  const t=g(id,type==='dc'?Object.keys(ed.ros).find(k=>ed.ros[k].includes(id)):sd),won=(sd===0)===w0;

  .sort((a,b)=>b.pts-a.pts||(b.sw+b.dw)-(a.sw+a.dw)||P(b.id).rt-P(a.id).rt||a.id-b.id).slice(0,5)}

 HI.forEach(i=>{const d=E[i],r=evCell(i);h+=`<tr class="${i===S.idx&&S.ev[i].st!==2?'nxr':''}"><td>${d[4]}<td><b>${d[0]}</b><td>${tier(d[2])}<td>${surfChip(i)}<td>${stat(i)}<td>${r?r.w:'—'}<td>${r?r.f:''}<td>${i<=S.idx?`<button class="b s" data-a="open" data-x="${i}">${r?((d[2]==='DC'||d[2]==='LC')?'View':'Draw'):'Open'}</button>`:''}</tr>`});

function hSlam(){const nmS=E.filter(d=>d[2]===2000).map(d=>d[0]),idxs=[0,9,13,17],seasons=[...new Set(S.slams.map(x=>x.s))],th=nmS.map(n=>`<th>${n}`).join('');

 const srt=(a,b)=>b[1].G-a[1].G||b[1].S-a[1].S||b[1].B-a[1].B,row=(n,m)=>`<td class=n>${m.G}<td class=n>${m.S}<td class=n>${m.B}<td class=n><b>${m.G+m.S+m.B}</b>`;

 return `<p class="mut">Career titles are tour events only. Olympic medals and Davis Cup titles are counted separately.</p><div class="card" style="max-height:78vh"><table class="s1"><tr><th>Player<th class=n>Titles<th class=n>Slams<th class=n>M1000<th class=n>500s<th class=n>🥇<th class=n>🥈<th class=n>🥉<th class=n>Cups</tr>`+(rows.length?rows.map(({p,d,m})=>`<tr data-a="prof" data-x="${p.id}" style="cursor:pointer"><td>${nm(p.id)}<td class=n><b>${p.ct}</b><td class=n>${p.cs}<td class=n>${p.cm}<td class=n>${p.c5}<td class=n>${m.filter(x=>x.m==='G').length}<td class=n>${m.filter(x=>x.m==='S').length}<td class=n>${m.filter(x=>x.m==='B').length}<td class=n>${d.ti}</tr>`).join(''):'<tr><td colspan=9 class=mut>Empty — nobody has won anything yet.</tr>')+'</table></div>'}
function hYe(){return `<div class="card"><table class="s1"><tr><th>Year<th>#1<th>#2<th>#3<th>#4<th>#5</tr>`+(S.hist.length?S.hist.slice().reverse().map(y=>`<tr><td><b>${y.s}</b>`+y.top.map(([id,p])=>`<td>${nm(id)}<br><span class=mut>${p} pts</span>`).join('')+'</tr>').join(''):'<tr><td colspan=6 class=mut>Recorded at the end of each season.</tr>')+'</table></div>'}
function vHist(){const subs=[['slam','Grand Slams'],['oly','Olympics'],['dc','Davis Cup'],['lc','Laver Cup'],['tit','All-Time Titles'],['ye','Year-End Top 5'],['rec','Records'],['hof','🏛️ Hall of Fame']];

const STG=['Group · Matchday 1','Group · Matchday 2','Group · Matchday 3','Quarterfinals','Semifinals','Final'];
function tieHTML(t,ed,ev){const sc=tieSc(t),cur=ev&&t.stage===ev.stage&&t.w==null,n=t.r.length,ix=DC_ORD[n],dn=ids=>ids.map(id=>P(id).n).join(' / '),nxt=()=>ed.v2&&n===2?`Doubles: ${dn(ed.ros[t.a].slice(0,2))} v ${dn(ed.ros[t.b].slice(0,2))}`:`${P(ed.ros[t.a][ix]).n} v ${P(ed.ros[t.b][ix]).n}`;

 +(cur?`<div class="f"><span>Best of ${t.bo} sets</span><span><button class="b g s" data-a="dcRub" data-x="${t.id}">Sim Rubber</button> <button class="b s" data-a="dcPlay" data-x="${t.id}">Play</button> <button class="b s" data-a="dcTie" data-x="${t.id}">Sim Tie</button></span></div>`:'')+'</div>'}

 ed.groups.forEach(g=>{const T=gStand(g),ord=g.order?g.order.map(c=>T[c]):gOrder(g,false);
  h+=`<div class="card" style="padding:10px"><b>Group ${g.n}</b><table class="s1" style="margin-top:6px"><tr><th>Team<th class=n>P<th class=n>W<th class=n>L<th class=n>Pts<th class=n>Rub<th class=n>Sets</tr>${ord.map((x,k)=>`<tr><td>${g.order&&(ed.v2?k<2:k===0)?'✅ ':''}${natN(x.c)}${nsd(x.c)}<td class=n>${x.pl}<td class=n>${x.w}<td class=n>${x.l}<td class=n><b>${x.pts}</b><td class=n>${x.rw}-${x.rl}<td class=n>${x.sw}-${x.sl}</tr>`).join('')}</table>${g.ties.map(t=>tieHTML(t,ed,ev)).join('')}</div>`});
 h+='</div>';const ko=(l,ts,m)=>`<div class="sh" style="margin-top:14px"><h3>${l}</h3></div><div class="dg">${ts.length?ts.map(t=>`<div>${tieHTML(t,ed,ev)}</div>`).join(''):`<p class="mut">${m}</p>`}</div>`;
 return h+(ed.v2?ko('Quarterfinals · first to 3 sets',ed.qfs||[],'Decided after the group stage — top 2 from each group.'):'')+ko('Semifinals · first to 3 sets',ed.sfs||[],ed.v2?'Decided after the quarterfinals.':'Decided after the group stage.')+ko('Final · first to 3 sets',ed.fin?[ed.fin]:[],'Decided after the semifinals.')+mvpHTML(ed,'dc')}
function dcPreview(){const u=dcSetup(),ev=S.ev[DCI];return `<p><b>Host:</b> ${natN(ev.host)} · <b>Surface:</b> ${chip(ev.sf)}</p><p class="mut">16 nations in 4 groups of 4 (round robin); the top 2 of each group reach the quarterfinals, then semifinals and the final. Each nation fields its top 2 ranked players: Day 1 is #2 v #2, Day 2 is #1 v #1, and if the tie is level 1-1 a doubles match decides it. Seeding is by team strength${u.prev?` — defending champion ${natN(u.prev)} is automatically seed 1 and hosts`:'; the 2027 host is drawn at random'}. Surface: host nations with a home tournament use that surface; the others pick the surface that suits their team.</p><div class="card"><table class="s1"><tr><th>Seed<th>Nation<th>#1<th>#2</tr>${u.order.map((c,k)=>`<tr><td class=n>${k+1}<td>${natN(c)}${c===u.prev?' 🏠':''}${u.ros[c].map(id=>`<td>${nm(id)} <small class="mut">#${u.pos[id]}</small>`).join('')}</tr>`).join('')}</table></div>`}
function dcEd(){const ev=S.ev[DCI],hd=held(DCI),ys=[...new Set([...eds().map(e=>e.s),...(hd?[S.season]:[])])].sort();
