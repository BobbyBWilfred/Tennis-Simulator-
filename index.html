 $('#sub').textContent=`${S.season} · ${Math.min(S.idx,E.length)}/${E.length} events`;$('#no1').innerHTML=`<span class="pf">World #1: ${r.p.n} (${r.pts})</span><span class="pm">#1 ${r.p.n} (${r.pts})</span>`;$('#main').innerHTML=VIEWS[UI.view]();const on=$('.rt .b.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
 const q=$('#q');if(q)q.oninput=()=>{UI.q=q.value;$('#rk').innerHTML=(UI.view==='pl'?plRows:rkRows)(UI.q.toLowerCase())}}

/* ===== MATCH CENTER ===== */
const ptTxt=(m,i)=>{if(m.tb)return m.pts[i];const a=m.pts[i],b=m.pts[1-i];return a>=3&&b>=3?(a>b?'AD':a===b?'40':'40'):['0','15','30','40'][a]};
function lock(){document.body.classList.toggle('mo',!!($('#mroot').firstChild||$('#proot').firstChild))}
function renderM(){const M=UI.m;if(!M){$('#mroot').innerHTML='';lock();return}const m=M.m,sv=serverOf(m),d=E[M.i];
 const row=i=>`<tr><td>${!m.done&&sv===i?'🎾':''}<td>${flag(m.p[i].c)} ${m.p[i].n} ${M.sd[i]?`<small class=mut>(${M.sd[i]})</small>`:''}${m.done&&m.w===i?' 🏆':''}`+m.sets.map(s=>`<td>${s.g[i]}${s.tb!=null&&s.g[i]===6?`<sup>${s.tb}</sup>`:''}`).join('')+(m.done?'':`<td style="color:var(--H)">${m.games[i]}<td class=pt>${ptTxt(m,i)}`)+'</tr>';
 const st=(l,f)=>`<tr><td class=n>${f(0)}<td style="text-align:center">${l}<td class=n>${f(1)}</tr>`,pc=(a,b)=>b?Math.round(100*a/b)+'%':'–';
 $('#mroot').innerHTML=`<div class="modal"><div><div class="sh"><div><h3>${d[0]} · ${M.rl}</h3><span class="mut">${SN[d[3]]} · Best of ${m.bo}${m.tb?' · TIEBREAK (to '+m.tbTo+')':''}</span></div><button class="b g s" data-a="closeM">Close</button></div>
 <table class="sb">${row(0)}${row(1)}</table><div class="ctl">${[['shot','Sim Shot'],['point','Sim Point'],['game','Sim Game'],['set','Sim Set'],['match','Sim Match']].map(([k,l])=>`<button class="b ${k==='match'?'y':''}" data-a="mm" data-x="${k}" ${m.done?'disabled':''}>${l}</button>`).join('')}</div>
 <div class="log">${m.last.map(x=>`<div>${x}</div>`).join('')||'<span style="opacity:.6">Ready — press a button to start. Serve: '+ln(m,sv)+'</span>'}</div>
 <p class="mut" style="margin:6px 0 2px"><b>Game log:</b> ${m.log.slice(0,4).join(' · ')||'—'}</p>
 <table style="margin-top:8px">${st('Aces',i=>m.st[i].a)}${st('Double faults',i=>m.st[i].df)}${st('Winners',i=>m.st[i].wn)}${st('Unforced errors',i=>m.st[i].ue)}${st('1st serve in',i=>pc(m.st[i].f1,m.st[i].sp))}${st('Points won on serve',i=>pc(m.st[i].spw,m.st[i].sp))}${st('Total points won',i=>m.st[i].pw)}</table></div></div>`;
 const lg=$('.log');if(lg)lg.scrollTop=0;lock()}
function recordM(){const M=UI.m,m=M.m;if(m.done&&!M.rec){M.rec=1;const mt=S.ev[M.i].rounds[M.r][M.mi];mt.w=m.w?mt.b:mt.a;mt.s=scoreStr(m);save();toast(`${m.p[m.w].n} wins ${mt.s}`);render()}}

/* ===== ACTIONS ===== */
const A={
 tab:x=>{UI.view=x;render();window.scrollTo(0,0)},open:x=>{window.scrollTo(0,0);UI.vi=+x;UI.rt=Math.max(0,S.ev[+x].st===2?5:S.ev[+x].r);UI.view='event';render()},
 prof:x=>{renderP(+x);lock()},closeP:()=>{$('#proot').innerHTML='';lock()},
 saveP:x=>{const p=P(+x),v=k=>$('#'+k).value,num=(k,lo,hi,d)=>{const n=parseInt(v(k));return isNaN(n)?d:cl(n,lo,hi)};
  const o0={rt:p.rt,sv:p.sv,rn:p.rn,by:p.by};p.n=v('pn').trim()||p.n;p.c=(v('pc').trim().toUpperCase().slice(0,2))||p.c;p.rt=num('prt',1,99,p.rt);p.sv=num('psv',1,99,p.sv);p.rn=num('prn',1,99,p.rn);p.sf=v('psf');p.by=S.season-num('page',15,60,ageOf(p));p.hi=Math.max(p.hi||0,p.rt);if(S.season===START){const o=p.o=p.o||{};['rt','sv','rn','by'].forEach(k=>{if(p[k]!==o0[k])o[k]=p[k]})}
  p.ct=num('pct',0,999,p.ct);p.cs=num('pcs',0,99,p.cs);p.cm=num('pcm',0,99,p.cm);p.c5=num('pc5',0,999,p.c5);save();A.closeP();render();toast('Player saved')},
 simOne:x=>{const i=UI.vi,mt=S.ev[i].rounds[UI.rt][+x];if(mt.w==null){simMt(mt,i);save();render()}},
 startEv:x=>{startEvent(+x);save();render()},rtab:x=>{UI.rt=+x;render()},pm:x=>{UI.pm=x;render()},
 simRd:x=>{simRound(+x);UI.rt=S.ev[+x].st===2?5:S.ev[+x].r;save();render()},simEv:x=>{simEvent(+x);UI.rt=5;save();render()},
 simNext:()=>{if(S.idx<E.length){const i=S.idx;simEvent(i);toast(`${E[i][0]}: ${P(S.ev[i].champ).n}`);render()}},
 simSeason:()=>{while(S.idx<E.length)simEvent(S.idx);toast('Year complete');render()},
 newSeason:()=>{newSeason();render();toast('Ratings updated — see Calendar')},retireAll:()=>{if(confirm('Retire all players at age '+RET_AGE+'? The simulation will end and the history stays viewable.')){retireAll();render()}},pf:x=>{UI.pf=x;render()},
 play:x=>{const i=UI.vi,ev=S.ev[i],mt=ev.rounds[UI.rt][+x],d=E[i];UI.m={m:newMatch(P(mt.a),P(mt.b),d[3],d[2]===2000?5:3,d[2]===2000),i,r:UI.rt,mi:+x,rl:RNL[UI.rt],sd:[ev.seed[mt.a],ev.seed[mt.b]]};renderM()},
 mm:x=>{({shot:stepShot,point:stepPoint,game:stepGame,set:stepSet,match:stepMatch})[x](UI.m.m);recordM();renderM()},
 closeM:()=>{UI.m=null;renderM()},
 restart:()=>{if(confirm('Restart from 2027? The original 64-player roster returns at age 18 with its starting ratings. Your edits to those players\' name, country, surface, ratings and age are kept; results, rankings and career titles reset.')){const base=genPlayers();S={season:2027,idx:0,players:base.map((b,i)=>{const p=S.players[i],o=p.o||{},q={...b,n:p.n,c:p.c,sf:p.sf,o:p.o};['rt','sv','rn','by'].forEach(k=>{if(o[k]!=null)q[k]=o[k]});q.hi=q.rt;return q}),ev:freshEv(),slams:[],news:[],hist:[],done:false};UI.view='cal';UI.m=null;save();render()}}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)A[t.dataset.a](t.dataset.x)});
render();
})();
</script></body></html>
